[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "equitylens-ai"
version = "0.1.0"
description = "Evidence-grounded AI equity research system for auditable financial analysis."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.28,<2",
    "pymupdf4llm>=0.3,<1",
    "docling>=2,<3",
    "openai>=3.16,<4",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require real external documents or heavyweight document parsing",
]

[tool.ruff]
line-length = 100
target-version = "py312"